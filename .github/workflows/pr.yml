name: PR checks

on:
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          args: "check ."

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"
          enable-cache: true
      - run: uv sync --frozen
      # GPU / GL tests skip themselves on runners without hardware.
      - name: Pytest
        run: uv run pytest tests/ -v

  dagster-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"
          enable-cache: true
      - run: uv sync --frozen
      - name: Dagster definitions load
        run: uv run dagster definitions validate -m orchestration.definitions

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir:
          - stages/s08_zoom_cloud_cpu/terraform
          - stages/s09_zoom_fanout_cpu/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=${{ matrix.dir }} fmt -check
      - run: terraform -chdir=${{ matrix.dir }} init -backend=false
      - run: terraform -chdir=${{ matrix.dir }} validate

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        run: docker buildx build --platform linux/amd64 --load -t mandelflow:pr .
