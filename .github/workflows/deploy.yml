name: Deploy viewer to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "stages/s12_viewer_fastapi/**"
      - "common/**"
      - "render/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"

# Stub — remove the gate once Workload Identity Federation secrets are
# configured (GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SA, GCP_REGION,
# GCP_PROJECT). The viewer ships in the repo-root Dockerfile (one-image
# model) with a uvicorn entrypoint.
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: false  # remove this once configured
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - name: Build and push
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev
          docker build -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/mandelflow/viewer:${{ github.sha }} .
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/mandelflow/viewer:${{ github.sha }}
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy mandelflow-viewer \
            --image ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/mandelflow/viewer:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --command python \
            --args "-m,uvicorn,stages.s12_viewer_fastapi.main:app,--host,0.0.0.0,--port,8080" \
            --port 8080 \
            --allow-unauthenticated
